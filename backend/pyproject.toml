[project]
name = "openisave2-backend"
version = "1.0.0"
description = "OpenISave 2.0 — local-first multi-currency personal finance backend"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
